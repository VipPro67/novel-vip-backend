version: "3.9"

services  :
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
      - "5005:5005"
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: "novel-vip"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${GRAFANA_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=${GRAFANA_OTLP_AUTH}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "none"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s 
    volumes:
      - ~/.m2:/root/.m2
      - app_logs:/app/logs
      - ./src/main/resources/novelvip.json:/app/config/novelvip.json:ro
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
volumes:
  postgres_data: {}
  es_data: {}
  opensearch_data: {}
  redis_data: {}
  app_logs: {}
  caddy_data: {}
  caddy_config: {}
